name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

# Read the repo, write the Pages deployment, and mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight one finish rather than
# cancelling it, so a half-published site is not left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      # next build runs tsc, so a type error fails the deploy rather than
      # shipping a broken page.
      - name: Build static export
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
